name: Alpha release
on:
  push:
    tags:
      - 'v*-alpha.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing alpha tag to release
        required: true
        default: v0.1.0-alpha.1
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate alpha tag
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install Arabic fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-core
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
      - name: Build and check source package
        shell: bash
        run: |
          mkdir -p dist
          R CMD build .
          mv arabicR_*.tar.gz dist/
          Rscript -e 'rcmdcheck::rcmdcheck(Sys.glob("dist/arabicR_*.tar.gz")[[1]], args = "--no-manual", error_on = "warning")'
          R CMD INSTALL dist/arabicR_*.tar.gz
          Rscript inst/examples/arabic.R
          (cd dist && sha256sum arabicR_*.tar.gz > SHA256SUMS)
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/arabicR_*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$RELEASE_TAG" dist/arabicR_*.tar.gz dist/SHA256SUMS \
              --verify-tag --prerelease --title "arabicR $RELEASE_TAG" --notes-file NEWS.md
          fi
